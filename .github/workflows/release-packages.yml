name: Release packages

on:
  # Publishing is gated behind a published GitHub Release (not a bare tag push),
  # so the release notes + tag are reviewed before anything ships to public npm.
  # The release tag must match cursorkit-v* or v* (enforced in "Validate release tag").
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run release validation and pack the tarball without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-package:
    name: build, test, and publish @velum-labs/cursorkit to npm
    # macOS keeps `pnpm codegen` byte-identical to the committed src/gen (the
    # generated protobuf code is platform-sensitive); the diff gate below relies
    # on it.
    runs-on: macos-latest
    timeout-minutes: 25
    if: github.repository == 'velum-labs/cursorkit'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      # NB: no `registry-url:` here on purpose. setup-node's registry-url writes
      # a `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line into .npmrc;
      # a present (or empty) _authToken makes npm use token auth and SHADOWS OIDC
      # trusted publishing. npm publishes to the default registry without it.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/extract-cursor-protos/go.mod
          cache-dependency-path: vendor/extract-cursor-protos/go.mod

      # `npm publish` performs the OIDC exchange via the npm CLI, which must be
      # >= 11.5.1 for trusted publishing. A Trusted Publisher for
      # @velum-labs/cursorkit is configured on npmjs.com, so publishing is
      # token-free via OIDC (provenance is emitted automatically).
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Validate release tag
        if: github.event_name == 'release'
        run: |
          case "${{ github.event.release.tag_name }}" in
            cursorkit-v*|v*) echo "release tag ${{ github.event.release.tag_name }} ok" ;;
            *) echo "release tag must match cursorkit-v* or v*"; exit 1 ;;
          esac

      - run: pnpm install --frozen-lockfile

      - name: Regenerate protobuf bindings
        run: pnpm codegen

      - name: Generated bindings are committed and current
        run: git diff --exit-code -- src/gen

      - name: Validate publish config
        run: pnpm release:publish:check

      - name: Check (build + test + protocol + format)
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Proto extractor tests
        run: go test ./...
        working-directory: vendor/extract-cursor-protos

      - name: Read package metadata
        id: metadata
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const pkg = require('./package.json');
          console.log(`name=${pkg.name}`);
          console.log(`version=${pkg.version}`);
          console.log(`publishable=${pkg.private === false ? 'true' : 'false'}`);
          NODE

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        run: |
          mkdir -p dist-release
          pnpm pack --pack-destination dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: cursorkit-npm-package-${{ steps.metadata.outputs.version }}
          path: dist-release/*.tgz
          if-no-files-found: error

      - name: Dry-run publish (no deploy)
        if: github.event_name == 'workflow_dispatch'
        # The ./ prefix is required so npm treats the argument as a local tarball
        # rather than a GitHub owner/repo git spec.
        run: npm publish ./dist-release/*.tgz --provenance --access public --dry-run

      - name: Publish @velum-labs/cursorkit to npm
        if: >-
          github.event_name == 'release' &&
          steps.metadata.outputs.publishable == 'true'
        # No NODE_AUTH_TOKEN: publishing is via OIDC trusted publishing. The ./
        # prefix is required so npm treats the argument as a local tarball rather
        # than a GitHub owner/repo git spec.
        run: npm publish ./dist-release/*.tgz --provenance --access public
