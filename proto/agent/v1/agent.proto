service AgentService {
	rpc Run(AgentClientMessage) returns (AgentServerMessage) {}
	rpc RunSSE(AiserverV1_BidiRequestId) returns (stream AgentServerMessage) {}
	rpc RunPoll(AiserverV1_BidiPollRequest) returns (stream AiserverV1_BidiPollResponse) {}
	rpc NameAgent(NameAgentRequest) returns (NameAgentResponse) {}
	rpc UpdateConversationMetadata(UpdateConversationMetadataRequest) returns (UpdateConversationMetadataResponse) {}
	rpc CreateTranscriptOverview(CreateTranscriptOverviewRequest) returns (CreateTranscriptOverviewResponse) {}
	rpc GetUsableModels(GetUsableModelsRequest) returns (GetUsableModelsResponse) {}
	rpc GetDefaultModelForCli(GetDefaultModelForCliRequest) returns (GetDefaultModelForCliResponse) {}
	rpc GetAllowedModelIntents(GetAllowedModelIntentsRequest) returns (GetAllowedModelIntentsResponse) {}
	rpc UploadConversationBlobs(UploadConversationBlobsRequest) returns (UploadConversationBlobsResponse) {}
	rpc GetSignedUrlForAttachedMedia(GetSignedUrlForAttachedMediaRequest) returns (GetSignedUrlForAttachedMediaResponse) {}
	rpc NotifyConversationClone(NotifyConversationCloneRequest) returns (NotifyConversationCloneResponse) {}
	rpc GetNewChatNudgeLegacyModelPicker(GetNewChatNudgeLegacyModelPickerRequest) returns (GetNewChatNudgeLegacyModelPickerResponse) {}
	rpc GetNewChatNudgeParameterizedModelPicker(GetNewChatNudgeParameterizedModelPickerRequest) returns (GetNewChatNudgeParameterizedModelPickerResponse) {}
}

service ControlService {
	rpc Ping(PingRequest) returns (PingResponse) {}
	rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse) {}
	rpc Exec(ExecRequest) returns (stream ExecResponse) {}
	rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse) {}
	rpc ReadTextFile(ReadTextFileRequest) returns (ReadTextFileResponse) {}
	rpc WriteTextFile(WriteTextFileRequest) returns (WriteTextFileResponse) {}
	rpc ReadBinaryFile(ReadBinaryFileRequest) returns (ReadBinaryFileResponse) {}
	rpc WriteBinaryFile(WriteBinaryFileRequest) returns (WriteBinaryFileResponse) {}
	rpc GetDiff(AiserverV1_GetDiffRequest) returns (AiserverV1_GetDiffResponse) {}
	rpc BatchGetDiff(BatchGetDiffRequest) returns (BatchGetDiffResponse) {}
	rpc GetWorkspaceChangesHash(GetWorkspaceChangesHashRequest) returns (GetWorkspaceChangesHashResponse) {}
	rpc RefreshGithubAccessToken(RefreshGithubAccessTokenRequest) returns (RefreshGithubAccessTokenResponse) {}
	rpc WarmRemoteAccessServer(WarmRemoteAccessServerRequest) returns (WarmRemoteAccessServerResponse) {}
	rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) {}
	rpc UploadArtifacts(UploadArtifactsRequest) returns (UploadArtifactsResponse) {}
	rpc RestoreArtifacts(RestoreArtifactsRequest) returns (RestoreArtifactsResponse) {}
	rpc GetMcpRefreshTokens(GetMcpRefreshTokensRequest) returns (GetMcpRefreshTokensResponse) {}
	rpc DownloadCursorServer(DownloadCursorServerRequest) returns (DownloadCursorServerResponse) {}
	rpc UpdateEnvironmentVariables(UpdateEnvironmentVariablesRequest) returns (UpdateEnvironmentVariablesResponse) {}
	rpc ReloadAgentSkills(ReloadAgentSkillsRequest) returns (ReloadAgentSkillsResponse) {}
	rpc ReloadPlugins(ReloadPluginsRequest) returns (ReloadPluginsResponse) {}
	rpc InstallPluginArtifact(InstallPluginArtifactRequest) returns (InstallPluginArtifactResponse) {}
}

service ExecService {
	rpc Exec(ExecServerMessage) returns (stream ExecStreamElement) {}
}

message GoogleProtobuf_Empty { // google.protobuf.Empty
}

service PrivateWorkerApiService {
	rpc GetWorkerId(GoogleProtobuf_Empty) returns (GetWorkerIdResponse) {}
	rpc WatchStatus(GoogleProtobuf_Empty) returns (stream WatchStatusResponse) {}
}

service PrivateWorkerBridgeExternalService {
	rpc Connect(Frame) returns (Frame) {}
}

service LifecycleService {
	rpc ResetInstance(Empty) returns (Empty) {}
	rpc RenewInstance(Empty) returns (Empty) {}
	rpc ClaimWorker(ClaimWorkerRequest) returns (Empty) {}
	rpc ReleaseWorker(ReleaseWorkerRequest) returns (Empty) {}
}

service PtyHostService {
	rpc SpawnPty(SpawnPtyRequest) returns (SpawnPtyResponse) {}
	rpc AttachPty(AttachPtyRequest) returns (stream PtyEvent) {}
	rpc SendInput(SendInputRequest) returns (SendInputResponse) {}
	rpc ResizePty(ResizePtyRequest) returns (ResizePtyResponse) {}
	rpc ListPtys(ListPtysRequest) returns (ListPtysResponse) {}
	rpc TerminatePty(TerminatePtyRequest) returns (TerminatePtyResponse) {}
}

service TmuxSessionService {
	rpc CreateSession(CreateTmuxSessionRequest) returns (CreateTmuxSessionResponse) {}
	rpc ListSessions(ListTmuxSessionsRequest) returns (ListTmuxSessionsResponse) {}
	rpc KillSession(KillTmuxSessionRequest) returns (KillTmuxSessionResponse) {}
	rpc AttachSession(AttachTmuxSessionRequest) returns (AttachTmuxSessionResponse) {}
}
