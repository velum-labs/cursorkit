syntax = "proto3";

package model_fusion.v1;

// CursorHarnessService is the cursorkit adapter boundary for executing a
// Cursor-backed model-fusion candidate. Fusionkit remains the canonical
// protobuf/Buf IDL owner; this checked-in proto is a narrow compatibility mirror
// until generated protocol packages are published for all consumers.
service CursorHarnessService {
  rpc RunCursorHarness(CursorHarnessRunRequest) returns (CursorHarnessRunResult);
}

// JSON records remain the persisted audit format. These fields carry validated
// cursor-run-request.v1 / harness-run-request.v1 shaped JSON across transport.
message CursorHarnessRunRequest {
  string cursor_run_request_json = 1;
  string harness_run_request_json = 2;
  string candidate_id = 3;
  string workspace_path = 4;
}

// JSON records remain the persisted audit format. These fields carry validated
// cursor-run-result.v1 / harness-run-result.v1 shaped JSON across transport.
message CursorHarnessRunResult {
  string cursor_run_result_json = 1;
  string harness_run_result_json = 2;
  repeated ModelFusionArtifactEvidence artifacts = 3;
}

message ModelFusionArtifactEvidence {
  string artifact_id = 1;
  string kind = 2;
  string uri = 3;
  string sha256 = 4;
  string redaction_status = 5;
}
